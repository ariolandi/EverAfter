# Production stack, copied to the server by .github/workflows/deploy.yml.
# Secrets live in a .env file next to this file on the server (see deploy/.env.example).
services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE is set by the deploy workflow}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://everafter:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/everafter
    ports:
      - '${APP_PORT:-3001}:3001'
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: everafter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: everafter
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U everafter -d everafter']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
