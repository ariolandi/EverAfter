services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: everafter
      POSTGRES_PASSWORD: everafter
      POSTGRES_DB: everafter
    ports:
      - '5433:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U everafter -d everafter']
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      target: server
    image: everafter-server
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://everafter:everafter@db:5432/everafter
    ports:
      - '3001:3001'
    depends_on:
      db:
        condition: service_healthy

  ui:
    build:
      context: .
      target: ui
    image: everafter-ui
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on:
      - server

volumes:
  db-data:
